name: Ruff

on:
  push:
    branches: [main]
  pull_request:

# Runner is controlled by the repo variable CI_RUNNER — see the comment in tests.yml.
jobs:
  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"
          args: check

  format:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"
          args: format --check
